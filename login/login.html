<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Biblioteca Web</title>

  <link rel="stylesheet" href="./login.css">
  <script type="module" src="./login.js"></script>
</head>

<body>
  <main class="pagina-login">
    <section class="apresentacao" aria-labelledby="titulo-sistema">
      <span class="identificacao">SISTEMA DE BIBLIOTECA</span>

      <h1 id="titulo-sistema">Biblioteca Web</h1>

      <p>
        Organize o acervo, cadastre livros e acompanhe
        as informações da biblioteca em um só lugar.
      </p>
    </section>

    <section class="area-login" aria-labelledby="titulo-login">
      <div class="cartao-login">
        <h2 id="titulo-login">Acesse sua conta</h2>

        <p class="descricao-login">
          Informe seu e-mail e sua senha para entrar.
        </p>

        <form id="formulario-login">
          <div class="campo">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              autocomplete="username"
              required
            >
          </div>

          <div class="campo">
            <label for="senha">Senha</label>

            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <p
            id="mensagem-login"
            class="mensagem"
            role="alert"
          ></p>

          <button type="submit" class="botao-entrar">
            Entrar
          </button>

          <a href="#" id="esqueceu-senha" class="link-senha">
            Esqueceu sua senha?
          </a>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
