<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de livros | Biblioteca Web</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="./cadastro-livro.css">

  <script type="module" src="./cadastro-livro.js"></script>
</head>

<body>
  <header class="cabecalho">
    <a class="nome-sistema" href="../dashboard/dashboard.html">
      BIBLIOTECA WEB
    </a>

    <p class="usuario">
      Olá, <span id="nome-usuario"></span>
    </p>
  </header>

  <div class="estrutura">
    <aside class="menu-lateral">
      <nav aria-label="Menu principal">
        <a
          href="../dashboard/dashboard.html"
          class="link-menu"
        >
          Dashboard
        </a>

        <a
          href="../cadastro-usuario/cadastro-usuario.html"
          class="link-menu"
        >
          Cadastro de usuários
        </a>

        <a
          href="./cadastro-livro.html"
          class="link-menu"
          aria-current="page"
        >
          Cadastro de livros
        </a>

        <a
          href="../listagem-livro/listagem-livro.html"
          class="link-menu"
        >
          Listar livros
        </a>

        <button class="link-menu" type="button" disabled>
          Realizar empréstimo
        </button>

        <button class="link-menu" type="button" disabled>
          Realizar devolução
        </button>

        <button
          id="botao-sair"
          class="link-menu botao-sair"
          type="button"
        >
          Sair
        </button>
      </nav>
    </aside>

    <main class="conteudo">
      <div class="titulo-pagina">
        <p class="sobretitulo">ACERVO</p>
        <h1>Cadastro de livros</h1>
        <p>Preencha os dados para adicionar um livro à biblioteca.</p>
      </div>

      <form id="formulario-livro" class="formulario-livro">
        <p class="aviso-campos">Todos os campos são obrigatórios.</p>

        <div class="campo-formulario">
          <label for="titulo">Título</label>

          <input
            type="text"
            id="titulo"
            name="titulo"
            minlength="4"
            maxlength="80"
            placeholder="Digite o título do livro"
            required
          >
        </div>

        <div class="campo-formulario">
          <label for="autor">Autor</label>

          <input
            type="text"
            id="autor"
            name="autor"
            minlength="4"
            maxlength="80"
            placeholder="Digite o nome do autor"
            required
          >
        </div>

        <div class="linha-formulario">
          <div class="campo-formulario">
            <label for="categoria">Categoria</label>

            <select id="categoria" name="categoria" required>
              <option value="">Selecione uma categoria</option>
              <option value="Programação">Programação</option>
              <option value="Web Design">Web Design</option>
              <option value="Banco de Dados">Banco de Dados</option>
              <option value="Ferramentas">Ferramentas</option>
              <option value="Design">Design</option>
            </select>
          </div>

          <div class="campo-formulario">
            <label for="paginas">Número de páginas</label>

            <input
              type="number"
              id="paginas"
              name="paginas"
              min="1"
              step="1"
              placeholder="Ex.: 200"
              required
            >
          </div>
        </div>

        <p
          id="mensagem-cadastro"
          class="mensagem-cadastro"
          role="status"
          aria-live="polite"
        ></p>

        <button
          type="submit"
          id="botao-salvar"
          class="botao-salvar"
        >
          Salvar
        </button>
      </form>
    </main>
  </div>
</body>
</html>
